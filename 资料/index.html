<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小游戏合集</title>
  <meta name="description" content="轻松打开和游玩果冻俄罗斯方块。">
  <style>
    :root {
      --ink: #fff6fb;
      --muted: rgba(255, 246, 251, .68);
      --line: rgba(255, 255, 255, .14);
      --accent: #ff7aa6;
      --accent-2: #7fe7ff;
      --bg: #12091e;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: ui-rounded, "PingFang SC", "Hiragino Maru Gothic ProN", "Yuanti SC", "Microsoft YaHei", system-ui, sans-serif;
      background:
        radial-gradient(900px 520px at 82% 15%, rgba(255, 122, 166, .28), transparent 58%),
        radial-gradient(760px 460px at 18% 92%, rgba(127, 231, 255, .18), transparent 54%),
        linear-gradient(150deg, #170b27 0%, #351142 55%, #0f081a 100%);
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      min-height: 100vh;
      display: grid;
      grid-template-rows: auto 1fr auto;
      position: relative;
      isolation: isolate;
    }

    .shell::before,
    .shell::after {
      content: "";
      position: fixed;
      inset: auto;
      border-radius: 999px;
      pointer-events: none;
      z-index: -1;
      filter: blur(.2px);
    }

    .shell::before {
      width: 42vw;
      max-width: 560px;
      aspect-ratio: 1;
      right: -12vw;
      top: 8vh;
      background: radial-gradient(circle at 32% 24%, rgba(255, 255, 255, .62), rgba(255, 122, 166, .34) 26%, rgba(255, 122, 166, .08) 64%, transparent 72%);
      animation: floatOrb 8s ease-in-out infinite;
    }

    .shell::after {
      width: 28vw;
      max-width: 360px;
      aspect-ratio: 1;
      left: 8vw;
      bottom: 7vh;
      background: radial-gradient(circle at 35% 28%, rgba(255, 255, 255, .58), rgba(127, 231, 255, .26) 28%, rgba(127, 231, 255, .07) 68%, transparent 76%);
      animation: floatOrb 9s ease-in-out infinite reverse;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 28px clamp(20px, 5vw, 72px);
      animation: reveal .7s ease both;
    }

    .brand {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .16em;
    }

    .nav-link {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 10px 16px;
      color: var(--muted);
      background: rgba(255, 255, 255, .045);
      transition: transform .18s ease, color .18s ease, background .18s ease;
    }

    .nav-link:hover {
      color: var(--ink);
      background: rgba(255, 255, 255, .09);
      transform: translateY(-2px);
    }

    main {
      display: grid;
      align-items: center;
      padding: 18px clamp(20px, 5vw, 72px) 56px;
    }

    .hero {
      display: grid;
      grid-template-columns: minmax(0, 1.02fr) minmax(280px, .78fr);
      gap: clamp(32px, 6vw, 86px);
      align-items: center;
      width: min(1180px, 100%);
      margin: 0 auto;
    }

    .copy {
      max-width: 680px;
      animation: reveal .8s .08s ease both;
    }

    .eyebrow {
      margin: 0 0 18px;
      color: var(--accent-2);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(54px, 9vw, 118px);
      line-height: .9;
      letter-spacing: 0;
      text-wrap: balance;
    }

    .intro {
      margin: 28px 0 0;
      max-width: 520px;
      color: var(--muted);
      font-size: clamp(17px, 2vw, 22px);
      line-height: 1.7;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      align-items: center;
      margin-top: 34px;
    }

    .play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 52px;
      border-radius: 16px;
      padding: 0 24px;
      color: #381021;
      font-weight: 900;
      background: linear-gradient(180deg, #ffd1df, var(--accent) 62%, #ff5d8f);
      box-shadow: 0 18px 34px rgba(255, 93, 143, .34), inset 0 2px 0 rgba(255, 255, 255, .68);
      transition: transform .16s cubic-bezier(.34, 1.56, .64, 1), box-shadow .16s ease;
    }

    .play:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 22px 42px rgba(255, 93, 143, .44), inset 0 2px 0 rgba(255, 255, 255, .72);
    }

    .hint {
      color: var(--muted);
      font-size: 14px;
    }

    .stage {
      position: relative;
      min-height: 520px;
      animation: reveal .8s .18s ease both;
    }

    .game-tile {
      position: absolute;
      inset: 50% auto auto 50%;
      width: min(370px, 78vw);
      aspect-ratio: .72;
      transform: translate(-50%, -50%) rotate(-3deg);
      border: 1px solid rgba(255, 255, 255, .18);
      border-radius: 30px;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .14), rgba(255, 255, 255, .035)),
        rgba(255, 255, 255, .055);
      box-shadow: 0 34px 80px rgba(0, 0, 0, .42), inset 0 1px 0 rgba(255, 255, 255, .28);
      backdrop-filter: blur(10px);
      overflow: hidden;
      transition: transform .25s ease;
    }

    .game-tile:hover {
      transform: translate(-50%, -51%) rotate(-2deg);
    }

    .board {
      position: absolute;
      inset: 22px;
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      grid-auto-rows: 1fr;
      gap: 8px;
    }

    .jelly {
      border-radius: 35% 45% 38% 42%;
      background: var(--c);
      box-shadow: inset 8px 8px 16px rgba(255, 255, 255, .32), inset -8px -10px 18px rgba(44, 8, 38, .18), 0 10px 22px rgba(0, 0, 0, .16);
      opacity: .96;
      animation: wobble 4.2s ease-in-out infinite;
      animation-delay: var(--d);
    }

    .jelly:nth-child(3n) {
      transform: translateY(18px);
    }

    .jelly:nth-child(4n) {
      transform: translateY(-10px);
    }

    .status {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: rgba(255, 246, 251, .84);
      font-weight: 800;
      font-size: 14px;
      letter-spacing: .06em;
    }

    .status span {
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 999px;
      padding: 9px 12px;
      background: rgba(18, 9, 30, .34);
    }

    footer {
      padding: 0 clamp(20px, 5vw, 72px) 26px;
      color: rgba(255, 246, 251, .48);
      font-size: 13px;
      animation: reveal .8s .28s ease both;
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: translateY(16px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes wobble {
      0%, 100% {
        border-radius: 35% 45% 38% 42%;
      }
      50% {
        border-radius: 46% 34% 44% 36%;
      }
    }

    @keyframes floatOrb {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(0, -18px, 0) scale(1.03);
      }
    }

    @media (max-width: 820px) {
      header {
        padding-top: 22px;
      }

      .hero {
        grid-template-columns: 1fr;
      }

      .stage {
        min-height: min(520px, 88vw);
        order: -1;
      }

      h1 {
        font-size: clamp(48px, 17vw, 88px);
      }

      .intro {
        margin-top: 20px;
      }

      .game-tile {
        width: min(330px, 78vw);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <a class="brand" href="/">GAMES</a>
      <a class="nav-link" href="/game">进入游戏</a>
    </header>

    <main>
      <section class="hero" aria-label="小游戏主页">
        <div class="copy">
          <p class="eyebrow">Now Playing</p>
          <h1>果冻俄罗斯方块</h1>
          <p class="intro">软弹的方块、清脆的消除、随手就能开一局。当前站点先收录这一款小游戏。</p>
          <div class="actions">
            <a class="play" href="/game">开始游戏</a>
            <span class="hint">键盘和触屏都可以玩</span>
          </div>
        </div>

        <div class="stage" aria-hidden="true">
          <a class="game-tile" href="/game" tabindex="-1">
            <div class="board">
              <span class="jelly" style="--c:#ff7aa6;--d:.0s"></span>
              <span class="jelly" style="--c:#ffd166;--d:.2s"></span>
              <span class="jelly" style="--c:#7fe7ff;--d:.1s"></span>
              <span class="jelly" style="--c:#b388ff;--d:.3s"></span>
              <span class="jelly" style="--c:#8cffbf;--d:.4s"></span>
              <span class="jelly" style="--c:#ff7aa6;--d:.2s"></span>
              <span class="jelly" style="--c:#7fe7ff;--d:.5s"></span>
              <span class="jelly" style="--c:#b388ff;--d:.1s"></span>
              <span class="jelly" style="--c:#ffd166;--d:.35s"></span>
              <span class="jelly" style="--c:#8cffbf;--d:.15s"></span>
              <span class="jelly" style="--c:#ff7aa6;--d:.45s"></span>
              <span class="jelly" style="--c:#7fe7ff;--d:.25s"></span>
              <span class="jelly" style="--c:#b388ff;--d:.05s"></span>
              <span class="jelly" style="--c:#ffd166;--d:.4s"></span>
              <span class="jelly" style="--c:#8cffbf;--d:.2s"></span>
              <span class="jelly" style="--c:#ff7aa6;--d:.5s"></span>
              <span class="jelly" style="--c:#7fe7ff;--d:.3s"></span>
              <span class="jelly" style="--c:#b388ff;--d:.1s"></span>
            </div>
            <div class="status">
              <span>JELLY</span>
              <span>TETRIS</span>
            </div>
          </a>
        </div>
      </section>
    </main>

    <footer>chatgpt.tangletang.top/game</footer>
  </div>
</body>
</html>
